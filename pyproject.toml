[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cinedata-agent"
version = "0.1.0"
description = "Text-to-SQL agent for the CineData catalog (SQLite Gold layer, OpenRouter free models)."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "pydantic-settings>=2.7",
    # The validator relies on AST class names (Attach, Analyze, SetOperation...) checked on 30.x.
    "sqlglot>=30.0,<31",
    "typer>=0.12",
    "rich>=13.7",
    # Windows ships no IANA time zone database; zoneinfo needs it for America/Sao_Paulo.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
databricks = [
    "databricks-sql-connector>=3.0",
]

[project.scripts]
cinedata = "cinedata_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cinedata_agent = ["prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Provided reference script that generated eval/gabarito.json; kept byte-identical on purpose.
extend-exclude = ["eval/gabarito.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Optional extra (databricks-sql-connector) ships no type information.
module = ["databricks", "databricks.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that need the real data/cinerocket.db (skipped when the file is missing)",
]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["cinedata_agent"]

[tool.coverage.report]
fail_under = 80
show_missing = true
